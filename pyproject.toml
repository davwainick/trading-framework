[project]
name = "trading-framework"
version = "0.1.0"
description = "A repeatable framework to formulate, backtest, validate, paper-trade, and live-deploy trading strategies."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vectorbt>=0.28.5,<1.1",
    "backtesting~=0.6.5",
    "numpy>=1.26,<2.5",
    "pandas>=2.2,<3.0",
    "pyarrow>=16",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "matplotlib>=3.8",
    "yfinance>=1.4.1",
]

[project.scripts]
tf = "framework.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framework"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
